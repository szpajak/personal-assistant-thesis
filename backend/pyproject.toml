[tool.poetry]
name = "career-assistant-backend"
version = "0.1.0"
description = "Backend for a career assistant with multimodal knowledge graph"
authors = ["Your Name <you@example.com>"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.23.0"}
SQLAlchemy = {version = "^2.0.33", extras = ["asyncio"]}
alembic = "^1.11.1"
"psycopg[binary]" = "^3.2.0"
asyncpg = "^0.29.0"
python-dotenv = "^1.0.0"
pydantic = {version = "^2.10.0", extras = ["email"]}
pydantic-settings = "^2.3.0"
email-validator = "^2.1.0"
neo4j = "^5.11.0"
celery = "^5.4.0"
redis = "^5.3.0"
httpx = "^0.28.0"
beautifulsoup4 = "^4.13.0"
openai = "^1.0.0"
tiktoken = "^0.7.0"
langchain = "^0.3.28"
# langchain-deepseek >=1.0.0 requires langchain-core >=1.0.0, which conflicts
# with langchain/langchain-community's <1.0.0 pin below (0.3.x line). Pin to
# the last 0.1.x release (langchain-core <1.0.0) until the whole langchain
# stack here is upgraded to the 1.x line together.
langchain-deepseek = "^0.1.4"
langchain-huggingface = "^0.1.0"
sentence-transformers = "^3.0.0"
langchain-community = "^0.3.18"
langgraph = "^0.2.74"
python-jose = {version = "^3.3.0", extras = ["cryptography"]}
bcrypt = "^4.0.1"
unstructured = {version = "^0.15.0", extras = ["pdf", "docx", "pptx"]}
imapclient = "^2.3.0"
fpdf2 = "^2.7.8"
jobspy2 = "^0.0.8"
pandas = "^2.0.0"
# Dev/test tools are optional extras so `pip install -e ".[dev]"` (CI) works.
# Poetry [dev-dependencies]/groups are not exposed as a pip extra.
pytest = { version = ">=8.4.0", optional = true }
pytest-asyncio = { version = ">=0.23.0", optional = true }
ruff = { version = ">=0.8.0", optional = true }
mypy = { version = ">=1.10.0", optional = true }
pre-commit = { version = ">=4.0.0", optional = true }
pytest-cov = { version = ">=5.0.0", optional = true }
aiosqlite = { version = ">=0.20.0", optional = true }

[tool.poetry.extras]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "pre-commit", "pytest-cov", "aiosqlite"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".git", "__pycache__", "build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 16

[tool.mypy]
python_version = 3.12
files = ["app"]
ignore_missing_imports = true
# Full strict mode still fails on SQLAlchemy Column attributes and a few
# third-party stubs. Keep incremental checks that CI can actually pass.
check_untyped_defs = true
warn_unused_ignores = false
warn_redundant_casts = false
disable_error_code = [
    "assignment",
    "arg-type",
    "union-attr",
    "type-arg",
    "call-overload",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
omit = ["app/alembic/*"]

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"
