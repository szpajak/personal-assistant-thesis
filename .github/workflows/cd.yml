name: CD

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build backend Docker image
        run: |
          docker build -f backend/Dockerfile -t ghcr.io/${{ github.repository }}/career-assistant-backend:latest .
      - name: Build frontend Docker image
        run: |
          docker build -f frontend/Dockerfile -t ghcr.io/${{ github.repository }}/career-assistant-frontend:latest .
      - name: Placeholder deploy step
        run: | 
          echo "Deploying backend and frontend images to environment..."
          # TODO: Implement deployment logic here

